name: Promote Release through Beta to Production

on:
  # A release tag starts the normal path with migrations disabled. A manual
  # dispatch of that same tag is the only way to authorize a migration retry.
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: Existing immutable vX.Y.Z release tag
        required: true
        type: string
      run_migrations:
        description: Authorize database migrations for this beta retry
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

# Keep the full release train serialized while production awaits approval. This
# prevents a newer tag from replacing the beta version under manual review.
concurrency:
  group: service-index-release-promotion
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Validate Deployment Ref
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      app_ref: ${{ steps.validate.outputs.app_ref }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      run_migrations: ${{ steps.validate.outputs.run_migrations }}

    steps:
      - name: Checkout selected application ref
        uses: actions/checkout@v5
        with:
          repository: access-ci-org/Operations_ServiceIndex_Django
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate selected ref
        id: validate
        env:
          APP_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version_tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_RUN_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations || false }}
        run: |
          set -euo pipefail

          COMMIT_SHA=$(git rev-parse 'HEAD^{commit}')

          if [[ ! "$APP_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$APP_REF' must use the vX.Y.Z release format."
            exit 1
          fi

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "Release promotion and migration retries must run from the release tag."
            exit 1
          fi

          if [[ "$SELECTED_REF" != "$APP_REF" ]]; then
            echo "Selected ref '$SELECTED_REF' does not match requested tag '$APP_REF'."
            exit 1
          fi

          if ! git rev-parse "refs/tags/$APP_REF" >/dev/null 2>&1; then
            echo "Tag '$APP_REF' does not exist."
            exit 1
          fi

          TAG_COMMIT_SHA=$(git rev-list -n 1 "refs/tags/$APP_REF")
          if [[ "$TAG_COMMIT_SHA" != "$COMMIT_SHA" ]]; then
            echo "Tag '$APP_REF' resolves to $TAG_COMMIT_SHA, not checked-out commit $COMMIT_SHA."
            exit 1
          fi

          RUN_MIGRATIONS=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RUN_MIGRATIONS="$REQUESTED_RUN_MIGRATIONS"
          fi
          if [[ "$RUN_MIGRATIONS" != "true" && "$RUN_MIGRATIONS" != "false" ]]; then
            echo "run_migrations must resolve to lowercase true or false."
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$RUN_MIGRATIONS" != "false" ]]; then
            echo "Only a manual beta dispatch may authorize migrations."
            exit 1
          fi

          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "Tag '$APP_REF' is not reachable from the main branch."
            echo "Only release tags created from main may enter the beta-to-production path."
            exit 1
          fi

          echo "Validated $REF_TYPE '$APP_REF' at $COMMIT_SHA"
          {
            echo "app_ref=$APP_REF"
            echo "commit_sha=$COMMIT_SHA"
            echo "run_migrations=$RUN_MIGRATIONS"
          } >> "$GITHUB_OUTPUT"

      - name: Verify a default-false beta attempt preceded migration authorization
        if: github.event_name == 'workflow_dispatch' && inputs.run_migrations
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.validate.outputs.app_ref }}
          COMMIT_SHA: ${{ steps.validate.outputs.commit_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'deploy-beta.yml',
                event: 'push',
                head_sha: process.env.COMMIT_SHA,
                per_page: 100,
              },
            );

            for (const run of runs) {
              if (run.head_branch !== process.env.TAG) {
                continue;
              }

              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: run.id, per_page: 100 },
              );
              const defaultFalseAttemptStopped = jobs.some(
                (job) =>
                  job.name === 'Deploy to Beta' && job.conclusion === 'failure',
              );

              if (defaultFalseAttemptStopped) {
                core.info(
                  `Found prior default-false beta attempt ${run.id} for ${process.env.TAG} at ${process.env.COMMIT_SHA}.`,
                );
                await core.summary
                  .addHeading('Beta migration retry eligibility', 2)
                  .addLink(`Prior default-false run ${run.id}`, run.html_url)
                  .addRaw(
                    '<p>Review that run to confirm pending migrations—not another failure—caused the stop.</p>',
                  )
                  .write();
                return;
              }
            }

            core.setFailed(
              `No failed default-false beta deployment was found for ${process.env.TAG} at ${process.env.COMMIT_SHA}.`,
            );

      - name: Record deployment candidate
        env:
          APP_REF: ${{ steps.validate.outputs.app_ref }}
          COMMIT_SHA: ${{ steps.validate.outputs.commit_sha }}
          RUN_MIGRATIONS: ${{ steps.validate.outputs.run_migrations }}
        run: |
          {
            echo "## Beta deployment candidate"
            echo
            echo "- **Tag:** $APP_REF"
            echo "- **Commit:** $COMMIT_SHA"
            echo "- **Actor:** $GITHUB_ACTOR"
            echo "- **Run migrations:** $RUN_MIGRATIONS"
          } >> "$GITHUB_STEP_SUMMARY"

  pre-deployment-checks:
    name: Pre-Deployment Checks
    needs: validate-ref
    runs-on: [self-hosted, linux, deployment, serviceindex]
    timeout-minutes: 15

    steps:
      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v5
        with:
          repository: access-ci-org/Operations_ServiceIndex_Infrastructure
          path: infrastructure
          token: ${{ secrets.INFRASTRUCTURE_REPO_TOKEN }}

      - name: Check beta server health
        run: |
          ssh -o StrictHostKeyChecking=no \
            ubuntu@beta-index.operations.access-ci.org \
            "echo 'Beta server is accessible'"

      - name: Check current deployment
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
        run: |
          CURRENT_VERSION=$(ssh \
            ubuntu@beta-index.operations.access-ci.org \
            "readlink -f /soft/serviceindex-1.0/PROD | xargs basename" || echo "unknown")

          echo "Currently deployed version: $CURRENT_VERSION"
          echo "Requested ref: $APP_REF"
          echo "Requested commit: $COMMIT_SHA"

          {
            echo "**Current beta version:** $CURRENT_VERSION"
            echo "**Requested ref:** $APP_REF"
            echo "**Requested commit:** $COMMIT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Ansible connectivity
        working-directory: infrastructure/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          ansible \
            -i hosts \
            beta-index.operations.access-ci.org \
            -m ping

  deploy-beta:
    name: Deploy to Beta
    needs: [validate-ref, pre-deployment-checks]
    runs-on: [self-hosted, linux, deployment, serviceindex]
    timeout-minutes: 60
    environment:
      name: beta
      url: https://beta-index.operations.access-ci.org/

    steps:
      - name: Deployment initiated
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
          RUN_MIGRATIONS: ${{ needs.validate-ref.outputs.run_migrations }}
        run: |
          echo "Starting beta deployment"
          echo "Ref: $APP_REF"
          echo "Commit: $COMMIT_SHA"
          echo "Run migrations: $RUN_MIGRATIONS"
          echo "Initiated by: $GITHUB_ACTOR"
          echo "Run ID: $GITHUB_RUN_ID"

      - name: Checkout Django Application at validated commit
        uses: actions/checkout@v5
        with:
          repository: access-ci-org/Operations_ServiceIndex_Django
          ref: ${{ needs.validate-ref.outputs.commit_sha }}
          path: django-app

      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v5
        with:
          repository: access-ci-org/Operations_ServiceIndex_Infrastructure
          path: infrastructure
          token: ${{ secrets.INFRASTRUCTURE_REPO_TOKEN }}

      - name: Create backup
        env:
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
        run: |
          SHORT_SHA=${COMMIT_SHA:0:12}
          BACKUP_DIR="/soft/backups/$(date +%Y%m%d-%H%M%S)-pre-$SHORT_SHA"

          # Values expanded into this remote command are derived from a commit
          # SHA and the current timestamp, so client-side expansion is intended.
          # shellcheck disable=SC2029
          ssh ubuntu@beta-index.operations.access-ci.org \
            "sudo mkdir -p /soft/backups && \
             sudo cp -r /soft/serviceindex-1.0/PROD '$BACKUP_DIR' && \
             echo 'Backup created at: $BACKUP_DIR'"

      - name: Run Ansible deployment
        working-directory: infrastructure/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
          RUN_MIGRATIONS: ${{ needs.validate-ref.outputs.run_migrations }}
        run: |
          echo "Deploying $APP_REF at $COMMIT_SHA to beta (run_migrations=$RUN_MIGRATIONS)"

          ansible-playbook \
            -i hosts \
            application_playbook.yml \
            --vault-password-file=<(printf '%s' "$ANSIBLE_VAULT_PASSWORD") \
            --limit=beta-index.operations.access-ci.org \
            --extra-vars "app_tag=$APP_REF git_version=$COMMIT_SHA run_migrations=$RUN_MIGRATIONS" \
            -vv

      - name: Verify deployment
        id: verify
        run: |
          echo "Waiting for the beta service to be ready"
          sleep 15

          SERVICE_STATUS=$(ssh ubuntu@beta-index.operations.access-ci.org \
            "systemctl is-active serviceindex.service" || echo "failed")
          echo "Service status: $SERVICE_STATUS"

          if [[ "$SERVICE_STATUS" != "active" ]]; then
            echo "Beta service is not active."
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -k https://beta-index.operations.access-ci.org/ \
            --max-time 30 || echo "000")
          echo "HTTP response: $HTTP_CODE"

          if [[ ! "$HTTP_CODE" =~ ^(200|301|302)$ ]]; then
            echo "Unexpected response from beta: HTTP $HTTP_CODE"
            exit 1
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        if: always()
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
          RUN_MIGRATIONS: ${{ needs.validate-ref.outputs.run_migrations }}
          VERIFICATION: ${{ steps.verify.outputs.status }}
        run: |
          {
            echo "## Beta Deployment Summary"
            echo
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| **Environment** | Beta |"
            echo "| **Target Host** | beta-index.operations.access-ci.org |"
            echo "| **Ref** | $APP_REF |"
            echo "| **Commit** | $COMMIT_SHA |"
            echo "| **Run migrations** | $RUN_MIGRATIONS |"
            echo "| **Deployed By** | $GITHUB_ACTOR |"
            echo "| **Deployment Status** | ${{ job.status }} |"
            echo "| **Verification** | $VERIFICATION |"
            echo
            echo "https://beta-index.operations.access-ci.org/"
          } >> "$GITHUB_STEP_SUMMARY"

  post-deployment-tests:
    name: Beta Post-Deployment Smoke Tests
    needs: [validate-ref, deploy-beta]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test beta endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -k https://beta-index.operations.access-ci.org/ \
            --max-time 30 || echo "000")
          echo "Beta page HTTP code: $HTTP_CODE"

          if [[ ! "$HTTP_CODE" =~ ^(200|301|302)$ ]]; then
            echo "Unexpected response from beta."
            exit 1
          fi

      - name: Record successful beta deployment
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
        run: |
          {
            echo "## Beta validation passed"
            echo
            echo "Ref $APP_REF at $COMMIT_SHA passed the post-deployment smoke test."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Approve and Deploy to Production
    needs: [validate-ref, post-deployment-tests]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/deploy-production.yml
    with:
      version_tag: ${{ needs.validate-ref.outputs.app_ref }}
      commit_sha: ${{ needs.validate-ref.outputs.commit_sha }}
      run_migrations: false
    secrets: inherit

  rollback-on-failure:
    name: Rollback Instructions
    needs: [validate-ref, deploy-beta]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Record rollback instructions
        env:
          APP_REF: ${{ needs.validate-ref.outputs.app_ref }}
          COMMIT_SHA: ${{ needs.validate-ref.outputs.commit_sha }}
          RUN_MIGRATIONS: ${{ needs.validate-ref.outputs.run_migrations }}
        run: |
          {
            echo "## Beta deployment failed"
            echo
            echo "Ref $APP_REF at $COMMIT_SHA did not complete successfully."
            echo "Production is not eligible to run. Review the failed step and beta backup."
            if [[ "$RUN_MIGRATIONS" == "false" ]]; then
              echo
              echo "If, and only if, the Ansible log shows that the default-false migration check stopped because migrations are pending, review the reported plan and start a new run for this exact tag:"
              echo
              echo '```bash'
              echo "gh workflow run deploy-beta.yml --repo access-ci-org/Operations_ServiceIndex_Django --ref $APP_REF --field version_tag=$APP_REF --field run_migrations=true"
              echo '```'
              echo
              echo "Do not use this command for configuration, connectivity, backup, or other playbook failures. Do not use Re-run failed jobs because it preserves run_migrations=false."
              echo "See .github/workflows/README.md for the full guarded procedure."
              echo "For non-migration failures, correct main and create a new patch release tag; do not move or reuse this tag."
            else
              echo
              echo "This was not a default-false deployment failure. Do not launch another migration-enabled retry from this summary."
              echo "Review whether schema changes began and follow the authorized recovery or rollback procedure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
