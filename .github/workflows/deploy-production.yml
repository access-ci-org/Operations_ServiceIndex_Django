name: Deploy to Production

on:
  # Production is reachable only from the release-promotion workflow after the
  # identical tag and commit have passed beta deployment and smoke tests.
  workflow_call:
    inputs:
      version_tag:
        required: true
        type: string
      commit_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: access-ci-org/Operations_ServiceIndex_Django
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0  # Fetch all history and tags

      - name: Validate tag exists
        id: validate
        env:
          TAG: ${{ inputs.version_tag }}
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          EXPECTED_WORKFLOW_REF="${GITHUB_REPOSITORY}/.github/workflows/deploy-beta.yml@${GITHUB_REF}"
          if [[ "$GITHUB_WORKFLOW_REF" != "$EXPECTED_WORKFLOW_REF" ]]; then
            echo "Production may only be called by deploy-beta.yml at the same release ref."
            echo "Expected caller: $EXPECTED_WORKFLOW_REF"
            exit 1
          fi
          
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' does not exist."
            exit 1
          fi
          
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must use the vX.Y.Z release format."
            exit 1
          fi

          TAG_COMMIT_SHA=$(git rev-list -n 1 "refs/tags/$TAG")
          if [[ "$TAG_COMMIT_SHA" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "Tag '$TAG' resolves to $TAG_COMMIT_SHA, not validated commit $EXPECTED_COMMIT_SHA."
            exit 1
          fi

          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$EXPECTED_COMMIT_SHA" "origin/main"; then
            echo "Tag '$TAG' is not reachable from the main branch."
            echo "Only tags created from main are allowed for production deploys."
            exit 1
          fi
          
          echo "Tag '$TAG' is valid, matches $EXPECTED_COMMIT_SHA, and is based on main."
          {
            echo "tag=$TAG"
            echo "commit_sha=$EXPECTED_COMMIT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Get tag info
        env:
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          echo "## Release Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: $TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Commit Details" >> $GITHUB_STEP_SUMMARY
          git show --no-patch --format="- **Commit**: %H%n- **Author**: %an (%ae)%n- **Date**: %ai%n- **Message**: %s" "$TAG" >> $GITHUB_STEP_SUMMARY

  create-release:
    name: Create GitHub Release
    needs: validate-tag
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Create release from tag
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true

  pre-deployment-checks:
    name: Pre-Deployment Checks
    needs: [validate-tag, create-release]
    runs-on: [self-hosted, linux, deployment, serviceindex]
    
    steps:
      - name: Checkout Infrastructure Repository  
        uses: actions/checkout@v5
        with:
          repository: access-ci-org/Operations_ServiceIndex_Infrastructure
          path: infrastructure
          token: ${{ secrets.INFRASTRUCTURE_REPO_TOKEN }}

      - name: Check production server health
        run: |
          echo "Checking production server accessibility..."
          # Uses /home/accessops-aws-root.pem that github-runner can access
          ssh -o StrictHostKeyChecking=no \
              ubuntu@service-index.operations.access-ci.org \
              "echo '✅ Production server is accessible'"

      - name: Check current deployment
        run: |
          echo "Current deployment information:"
          
          CURRENT_VERSION=$(ssh \
            ubuntu@service-index.operations.access-ci.org \
            "readlink -f /soft/serviceindex-1.0/PROD | xargs basename" || echo "unknown")
          
          echo "Currently deployed version: $CURRENT_VERSION"
          echo "Deploying version: ${{ needs.validate-tag.outputs.tag }}"
          
          echo "**Current Version**: $CURRENT_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**New Version**: ${{ needs.validate-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY

      - name: Verify Ansible connectivity
        working-directory: infrastructure/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          # Uses /home/accessops-aws-root.pem via hosts file configuration
          ansible \
            -i hosts \
            service-index.operations.access-ci.org \
            -m ping

  deploy-production:
    name: Deploy to Production
    needs: [validate-tag, pre-deployment-checks]
    runs-on: [self-hosted, linux, deployment, serviceindex]
    timeout-minutes: 60
    # Required reviewers configured on this environment provide the manual
    # inspection window after beta has passed. No step or environment secret is
    # available to the runner until that approval is granted.
    environment:
      name: production
      url: https://service-index.operations.access-ci.org
    
    steps:
      - name: Deployment initiated
        run: |
          echo "🚀 Starting production deployment..."
          echo "Version: ${{ needs.validate-tag.outputs.tag }}"
          echo "Initiated by: ${{ github.actor }}"
          echo "Run ID: ${{ github.run_id }}"

      - name: Checkout Django Application at Tag
        uses: actions/checkout@v5
        with:
          repository: access-ci-org/Operations_ServiceIndex_Django
          ref: ${{ needs.validate-tag.outputs.commit_sha }}
          path: django-app

      - name: Checkout Infrastructure Repository  
        uses: actions/checkout@v5
        with:
          repository: access-ci-org/Operations_ServiceIndex_Infrastructure
          path: infrastructure
          token: ${{ secrets.INFRASTRUCTURE_REPO_TOKEN }}

      - name: Create backup
        run: |
          echo "Creating pre-deployment backup..."
          
          BACKUP_DIR="/soft/backups/$(date +%Y%m%d-%H%M%S)-pre-${{ needs.validate-tag.outputs.tag }}"
          
          ssh ubuntu@service-index.operations.access-ci.org \
            "sudo mkdir -p /soft/backups && \
             sudo cp -r /soft/serviceindex-1.0/PROD $BACKUP_DIR && \
             echo 'Backup created at: $BACKUP_DIR'"

      - name: Run Ansible Deployment
        working-directory: infrastructure/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          APP_TAG: ${{ needs.validate-tag.outputs.tag }}
          COMMIT_SHA: ${{ needs.validate-tag.outputs.commit_sha }}
        run: |
          echo "Deploying version $APP_TAG at $COMMIT_SHA to production..."
          
          ansible-playbook \
            -i hosts \
            application_playbook.yml \
            --vault-password-file=<(printf '%s' "$ANSIBLE_VAULT_PASSWORD") \
            --limit=service-index.operations.access-ci.org \
            --extra-vars "app_tag=$APP_TAG git_version=$COMMIT_SHA" \
            -vv \
            || { echo "❌ Production deployment failed!"; exit 1; }

      - name: Run database migrations
        run: |
          echo "Running database migrations..."
          
          ssh ubuntu@service-index.operations.access-ci.org \
            "cd /soft/serviceindex-1.0 && \
             sudo -u software ./sbin/manage.prod.sh migrate --noinput"

      - name: Collect static files
        run: |
          echo "Collecting static files..."
          
          ssh ubuntu@service-index.operations.access-ci.org \
            "cd /soft/serviceindex-1.0 && \
             sudo -u software ./sbin/manage.prod.sh collectstatic --noinput"

      - name: Restart application service
        run: |
          echo "Restarting application service..."
          
          ssh ubuntu@service-index.operations.access-ci.org \
            "sudo systemctl restart serviceindex.service && \
             sleep 5 && \
             sudo systemctl status serviceindex.service"

      - name: Verify deployment
        id: verify
        run: |
          echo "Waiting for service to be ready..."
          sleep 15
          
          # Check service status
          SERVICE_STATUS=$(ssh ubuntu@service-index.operations.access-ci.org \
            "systemctl is-active serviceindex.service" || echo "failed")
          
          echo "Service status: $SERVICE_STATUS"
          
          if [[ "$SERVICE_STATUS" != "active" ]]; then
            echo "❌ Service is not active!"
            exit 1
          fi
          
          # Check HTTP response
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -k https://service-index.operations.access-ci.org \
            --max-time 30 || echo "000")
          
          echo "HTTP response: $HTTP_CODE"
          
          if [[ "$HTTP_CODE" =~ ^(200|301|302)$ ]]; then
            echo "✅ Service is responding correctly (HTTP $HTTP_CODE)"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Unexpected HTTP code: $HTTP_CODE"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Host** | service-index.operations.access-ci.org |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ needs.validate-tag.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed By** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Verification** | ${{ steps.verify.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### URL" >> $GITHUB_STEP_SUMMARY
          echo "https://service-index.operations.access-ci.org" >> $GITHUB_STEP_SUMMARY

  post-deployment-tests:
    name: Post-Deployment Smoke Tests
    needs: [validate-tag, deploy-production]
    runs-on: ubuntu-latest
    
    steps:
      - name: Test production endpoints
        run: |
          echo "Running smoke tests on production..."
          
          # Test main page
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -k https://service-index.operations.access-ci.org \
            --max-time 30)
          
          echo "Main page HTTP code: $HTTP_CODE"
          
          if [[ "$HTTP_CODE" =~ ^(200|301|302)$ ]]; then
            echo "✅ Main page is accessible"
          else
            echo "❌ Unexpected response from main page"
            exit 1
          fi

  notify-success:
    name: Notify Success
    needs: [validate-tag, deploy-production, post-deployment-tests]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Success notification
        run: |
          echo "✅ Production deployment successful!"
          echo "Version ${{ needs.validate-tag.outputs.tag }} is now live"
          echo "URL: https://service-index.operations.access-ci.org"

  rollback-on-failure:
    name: Rollback Instructions
    needs: [validate-tag, deploy-production]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Rollback instructions
        env:
          APP_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          {
            echo "## Production deployment failed"
            echo
            echo "Release $APP_TAG did not complete successfully."
            echo
            echo "1. Review the failed job and the timestamped pre-deployment backup recorded above."
            echo "2. If the failure is safely retryable, re-run the failed jobs from this promotion run; production approval still applies."
            echo "3. If rollback is required, follow the authorized production rollback runbook and select the actual previous known-good version."
            echo "4. Do not move or reuse release tag $APP_TAG."
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional: Slack notification
      # - name: Slack Notification
      #   if: env.SLACK_WEBHOOK_URL != ''
      #   uses: slackapi/slack-github-action@v1
      #   with:
      #     payload: |
      #       {
      #         "text": "❌ Production deployment FAILED",
      #         "blocks": [
      #           {
      #             "type": "section",
